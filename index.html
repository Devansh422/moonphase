<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---------- Quality tier: ?q=low|mid|high overrides auto-detect ----------
// Tiers only change how much work is done (buffer sizes), never what the scene looks like; the adaptive loop
// at the bottom then trims resolution further if a device still can't hold ~45 fps.
const qParam = new URLSearchParams(location.search).get('q');
const mobile = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 700;
const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || (mobile ? 4 : 8);
const TIER = ['low', 'mid', 'high'].includes(qParam) ? qParam
  : mobile ? (cores <= 4 || mem <= 3 ? 'low' : 'mid') : (cores >= 6 && mem >= 8 ? 'high' : 'mid');
const Q = {
  high: { maxPR: 1.75, msaa: 4 },
  mid:  { maxPR: 1.5,  msaa: 2 },                // 2x MSAA: keeps the moon's limb from stair-stepping
  low:  { maxPR: 1.0,  msaa: 0 },
}[TIER];
// phones are 2-3x screens: rendering the scene at 1.0-1.5x left the moon and sky soft. Start them at 2x; the adaptive
// loop below still steps it down if a phone can't hold ~45 fps. (Safari reports no deviceMemory, so many land in 'low'.)
if (mobile) Q.maxPR = 2;

// ---------- Renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(devicePixelRatio, Q.maxPR);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 1000);
camera.position.set(0, 2, 10.5);
function fitFov() { // Blender: 28mm lens on 36mm sensor
  const aspect = innerWidth / innerHeight;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(Math.atan(18 / 28)) / Math.max(aspect, 4 / 3)));
  camera.aspect = aspect; camera.updateProjectionMatrix();
}
fitFov();

// Choreographed camera (no orbit): intro framing -> pulled back for the watches, plus a faint pointer parallax
const CAM = {
  intro: { pos: new THREE.Vector3(0, 2, 10.5), tgt: new THREE.Vector3(0, 2.2, -4) },
  exp:   { pos: new THREE.Vector3(0, 2.25, 12.8), tgt: new THREE.Vector3(0, 1.05, 0) },
};
const camTgt = new THREE.Vector3(), pointer = new THREE.Vector2(), pointerS = new THREE.Vector2();
// mobile: no cursor parallax (a finger dragging the watch shouldn't swing the whole scene); pointer stays centred
if (!mobile) addEventListener('pointermove', (e) => pointer.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1));
const easeIO = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// quintic smootherstep: zero speed AND zero acceleration at both ends, so the entrance glides off and lands without a kick
const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);
const ENTER = { dur: 5.2, reveal: 0.82 };       // intro -> watch view seconds; progress at which the first watch flicks in
const clamp01 = (x) => Math.min(Math.max(x, 0), 1);

// ---------- Shared GLSL noise ----------
const NOISE = /* glsl */`
float hash13(vec3 p){ p = fract(p*0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3 hash33(vec3 p){ p = fract(p*vec3(.1031,.1030,.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1,0,0)), f.x), mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x), mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*vnoise(p); p = p*2.03 + 1.7; a *= 0.5; } return s; }
`;

const clock = new THREE.Clock();
const uTime = { value: 0 };

// ---------- Universe backdrop: the nebula HDRI as an equirectangular sky; it drifts with the pointer ----------
// HDR_multi_nebulae_2.hdr (10000x5000, 92 MB) ships as nebula_hdr.jpg (8192x4096, ~4 MB): linear values were stored as
// s = log2(1 + v/E) / L in 8 bits, which keeps ~13 stops (faint gas to the 18x-bright stars) within ~4% typical error.
const SKY_LOG = { E: 0.0005, L: 15.2877 };       // must match the encoder (hdr2log.py: E = 0.0005, M = 20)
const skyTex = new THREE.TextureLoader().load('nebula_hdr.jpg');
// raw data (no sRGB decode); no mipmaps: the atan() seam would pick the smallest mip and draw a line
Object.assign(skyTex, { colorSpace: THREE.NoColorSpace, generateMipmaps: false, minFilter: THREE.LinearFilter });
const skyU = { uSky: { value: skyTex }, uSkyExp: { value: 6 }, uSkyRot: { value: new THREE.Matrix3() }, uPR: { value: 1 }, uRes: { value: new THREE.Vector2(1, 1) },
  uTime, uFill: { value: 1 },
  uMoonDir: { value: new THREE.Vector3(0, 0, -1) }, uMoonRad: { value: 0.1 }, uMoonGlow: { value: 1 },
  uMS: { value: [] }, uMA: { value: [] }, uMP: { value: [] } };
// Shooting stars live on the sky sphere in the HDRI's own frame (rd = uSkyRot * view ray), so they turn with the
// nebula and shift with the camera like it. Like a real shower they all radiate from one fixed radiant: each runs
// along a great circle away from it at 12-30 deg/s (real meteor speeds). uMS = start dir, uMA = the circle's axis,
// uMP = (travel angle, tail angle, progress 0..1 or <0 off, peak brightness; negative = ends in a flare).
// Continuous: METEORS at once, each relaunching 0.3-2.5 s after it burns out.
const METEORS = 3;
const meteors = Array.from({ length: METEORS }, (_, i) => {
  skyU.uMS.value.push(new THREE.Vector3(1, 0, 0)); skyU.uMA.value.push(new THREE.Vector3(0, 1, 0));
  skyU.uMP.value.push(new THREE.Vector4(0, 0, -1, 0));
  return { t0: 0, dur: 1, next: 0.5 + i * 0.9 };   // staggered first launches
});
let radiant = null;                               // sky-frame direction, fixed at the first launch (up and behind the moon)
const mTmp = new THREE.Vector3();
const toSky = (v) => v.applyMatrix3(skyU.uSkyRot.value).normalize();
function meteorUpdate(t) {
  if (!radiant) radiant = toSky(new THREE.Vector3(-0.35, 1.0, -0.55));
  meteors.forEach((m, i) => {
    if (t >= m.next) {
      // start somewhere in the current view (most of its width, the upper two-thirds)
      const ty = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), tx = ty * camera.aspect;
      mTmp.set((Math.random() * 1.8 - 0.9) * tx, (Math.random() * 1.1 - 0.2) * ty, -1).applyQuaternion(camera.quaternion);
      const S = skyU.uMS.value[i].copy(toSky(mTmp)), A = skyU.uMA.value[i].crossVectors(radiant, S);
      if (A.lengthSq() < 1e-6) { m.next = t + 0.2; return; }   // started on the radiant itself: no direction, retry
      A.normalize();                                            // S is perpendicular to A by construction
      const dur = 0.4 + Math.random() * 0.8, travel = THREE.MathUtils.degToRad(12 + Math.random() * 18) * dur;
      const tail = Math.min(travel * 0.6, THREE.MathUtils.degToRad(4 + Math.random() * 8));
      const peak = (0.35 + Math.pow(Math.random(), 2.5) * 1.6) * (Math.random() < 0.3 ? -1 : 1);   // mostly faint, a few bright
      skyU.uMP.value[i].set(travel, tail, 0, peak);
      m.t0 = t; m.dur = dur; m.next = t + dur + 0.3 + Math.random() * 2.2;
    }
    const k = (t - m.t0) / m.dur;
    skyU.uMP.value[i].z = k >= 0 && k <= 1 ? k : -1;
  });
}
const sky = new THREE.Mesh(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3)),
  new THREE.ShaderMaterial({
    uniforms: skyU, depthTest: false, depthWrite: false,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vec4 v = inverse(projectionMatrix) * vec4(position.xy, 1.0, 1.0);
        vDir = transpose(mat3(viewMatrix)) * (v.xyz / v.w);              // view ray -> world direction
        gl_Position = vec4(position.xy, 1.0, 1.0);
      }`,
    fragmentShader: NOISE + /* glsl */`
      uniform sampler2D uSky; uniform mat3 uSkyRot; uniform float uPR, uTime, uSkyExp, uMoonRad, uMoonGlow, uFill; uniform vec2 uRes; uniform vec3 uMoonDir;
      uniform vec3 uMS[${METEORS}], uMA[${METEORS}]; uniform vec4 uMP[${METEORS}]; varying vec3 vDir;
      void main(){
        vec3 rd = uSkyRot * normalize(vDir);
        vec2 uv = vec2(atan(rd.z, rd.x) * 0.15915494 + 0.5, asin(clamp(rd.y, -1.0, 1.0)) * 0.31830989 + 0.5);
        // nebula_hdr.jpg is the HDRI log-encoded into 8 bits (see SKY_LOG): back to linear HDR, then exposed
        vec3 col = (exp2(texture2D(uSky, uv).rgb * ${SKY_LOG.L.toFixed(4)}) - 1.0) * ${SKY_LOG.E} * uSkyExp;
        // cap the brightest channel below the bloom threshold (hue kept): HDR star texels would otherwise bloom into squares
        col *= min(1.0, 1.6 / max(max(col.r, col.g), max(col.b, 1e-4)));
        // scintillation: only bright points (stars) flicker, each on its own noise cell (~1.5 px) and pace
        float lum = max(col.r, max(col.g, col.b));
        col *= 1.0 + smoothstep(0.12, 0.7, lum) * (vnoise(vec3(rd.xy * 900.0 + rd.z * 300.0, uTime * 2.5)) - 0.5) * 1.1;
        // the moon lights the sky round it: a faint cool glow falling off outside its disc (under the moon itself)
        vec3 vd = normalize(vDir);
        float ang = acos(clamp(dot(vd, uMoonDir), -1.0, 1.0));
        col += vec3(0.5, 0.56, 0.68) * 0.05 * exp(-max(ang - uMoonRad, 0.0) / 0.12) * uMoonGlow;
        // shooting stars (see meteorUpdate): measured on the sky sphere, so they ride the HDRI. Each pixel finds its
        // angle off the meteor's great circle (across) and how far behind the head it is along it (sa); pxAng turns
        // angles into screen px so the trail stays a 1 px line at any resolution.
        float pxAng = length(fwidth(rd));
        for (int i = 0; i < ${METEORS}; i++) {
          vec4 P = uMP[i];
          if (P.z < 0.0) continue;
          vec3 S = uMS[i], A = uMA[i];
          float hA = P.x * P.z;                                        // head's angle along the path
          vec3 H = S * cos(hA) + cross(A, S) * sin(hA);
          float off = asin(clamp(dot(rd, A), -1.0, 1.0));             // angle off the great circle
          vec3 pp = normalize(rd - A * sin(off));
          float sa = atan(dot(cross(pp, H), A), dot(pp, H));           // > 0: behind the head
          float tl = max(min(P.y, hA), 1e-4);                           // the tail grows out of the start point
          float trail = step(0.0, sa) * (1.0 - smoothstep(0.0, tl, sa)); trail *= trail;
          float ax = off / pxAng, hd = length(vec2(sa, off)) / pxAng;
          float lc = pow(sin(3.14159 * P.z), 0.6);                      // ignites, peaks, burns out
          if (P.w < 0.0) lc *= 1.0 + 1.5 * exp(-pow((P.z - 0.78) / 0.05, 2.0));   // terminal flare
          col += (vec3(0.82, 1.0, 0.95) * exp(-hd * hd / 2.5) * 1.4             // blue-green head (round, may bloom)
                + vec3(1.0, 0.88, 0.75) * trail * exp(-ax * ax / 0.6) * 0.9)   // warm, fading train
                 * lc * abs(P.w);
        }
        // fill light in the bottom corners: soft nebular glows (cool blue left, violet right) breathing with slow
        // drifting noise, so the lower edges aren't empty black
        vec2 sc = gl_FragCoord.xy / uRes, ar = vec2(uRes.x / uRes.y, 1.0);
        float haze = fbm(vec3(sc * ar * 2.2, uTime * 0.015));
        float gL = exp(-length((sc - vec2(-0.04, -0.12)) * ar) / 0.42);
        float gR = exp(-length((sc - vec2(1.04, -0.12)) * ar) / 0.42);
        col += (vec3(0.30, 0.40, 0.78) * gL + vec3(0.52, 0.42, 0.75) * gR) * (0.3 + 0.9 * haze) * 0.12 * uFill;
        gl_FragColor = vec4(col, 0.0);   // alpha 0: the grade keeps the nebula's colour
      }`,
  })
);
sky.frustumCulled = false; sky.renderOrder = -1;
scene.add(sky);

// ---------- Space dust: specks drifting through the volume between the camera and the moon ----------
// Positions wrap inside a box in the vertex shader, so the drift loops forever with no CPU work.
const DUST = { n: mobile ? 700 : 1600, box: new THREE.Vector3(30, 18, 34), lo: new THREE.Vector3(-15, -5, -20) };
const dustGeo = new THREE.BufferGeometry();
const dp = new Float32Array(DUST.n * 3), dr = new Float32Array(DUST.n);
for (let i = 0; i < DUST.n; i++) {
  dp[i * 3] = Math.random() * DUST.box.x; dp[i * 3 + 1] = Math.random() * DUST.box.y; dp[i * 3 + 2] = Math.random() * DUST.box.z;
  dr[i] = Math.random();
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dp, 3));
dustGeo.setAttribute('seed', new THREE.BufferAttribute(dr, 1));
const dust = new THREE.Points(dustGeo, new THREE.ShaderMaterial({
  uniforms: { uTime, uPR: skyU.uPR, uBox: { value: DUST.box }, uLo: { value: DUST.lo }, uShift: { value: new THREE.Vector3() } },
  transparent: true, depthWrite: false,
  // adds light but leaves alpha alone: alpha 0 is the grade's "keep colour" mark
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
  vertexShader: /* glsl */`
    uniform float uTime, uPR; uniform vec3 uBox, uLo, uShift; attribute float seed; varying float vA;
    void main(){
      // slow drift, mostly sideways and toward the camera, each speck at its own pace with a gentle sway
      vec3 vel = vec3(0.18, 0.05, 0.35) * (0.4 + seed);
      vec3 p = position + uShift + vel * uTime + 0.25 * vec3(sin(uTime * 0.3 + seed * 40.0), cos(uTime * 0.23 + seed * 70.0), 0.0);
      p = uLo + mod(p, uBox);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float z = -mv.z;
      gl_PointSize = clamp((0.9 + 2.2 * seed * seed) * uPR * 14.0 / z, 0.6 * uPR, 6.0 * uPR);
      // fade in from the far end of the box, out right in front of the lens; twinkle
      vA = smoothstep(0.5, 3.0, z) * (1.0 - smoothstep(22.0, 32.0, z)) * (0.55 + 0.45 * sin(uTime * (0.6 + seed * 1.7) + seed * 90.0));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying float vA;
    void main(){
      float r = length(gl_PointCoord - 0.5) * 2.0;                     // soft round speck
      float a = (1.0 - smoothstep(0.0, 1.0, r)) * vA;
      gl_FragColor = vec4(vec3(1.0, 0.97, 0.92) * a * 0.55, 0.0);
    }`,
}));
dust.frustumCulled = false;                       // the box moves in the shader; the CPU bounds would be stale
scene.add(dust);

// ---------- Lights (matched to the Blender setup) ----------

// ---------- Watches: the CZARD 360° frame sets used by home-page/index.html, streamed into the scene ----------
// Same keys and titles as the home page. Size is measured per watch (see caseFrac) so every case shows the same width.
const WATCHES = [
  ['veni', 'Veni'], ['vidi', 'Vidi'], ['vici', 'Vici'],
  ['ecru', 'ÉCRU'], ['lac-leman', 'LAC LÉMAN'], ['jura-gruen', 'JURA GRUÉN'],

// Loaded here rather than through spin.js: its images have no crossOrigin, so WebGL couldn't use its canvas.
// 1200 everywhere: the case fills only part of each frame, so on a 3x phone screen the 600 set was upscaled ~3x (blurry)
const FRAMES = 'https://portal.czard.com/frames/', FSIZE = 1200;
const manifest = fetch(FRAMES + 'manifest.json').then((r) => r.json()).then((m) => m.watches).catch(() => ({}));
const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image(); i.crossOrigin = 'anonymous'; i.decoding = 'async'; i.onload = () => res(i); i.onerror = rej; i.src = src;

const frameOrder = (n) => { const s = new Set(); for (const st of [9, 3, 1]) for (let i = 0; i < n; i += st) s.add(i); return [...s]; };
const sets = new Map();
function frameSet(key) {

    s.frames = new Array(e.frames);

    const q = frameOrder(e.frames);

    s.n = e.frames;

}

  return null;

// floating above the moon's horizon; every case is drawn 1.35 m wide (15% larger on mobile, where the screen is narrow)
const WATCH = { z: 3.6, caseW: 1.35 * (mobile ? 1.15 : 1) };
// rest on the camera's centre line at the watch's depth: the watch sits in the middle of the viewport
const REST_Y = CAM.exp.pos.y + (CAM.exp.tgt.y - CAM.exp.pos.y) * (CAM.exp.pos.z - WATCH.z) / (CAM.exp.pos.z - CAM.exp.tgt.z);
// widest opaque row of the front frame, as a fraction of the frame width (the case with its crown)
function caseFrac(img) {
  const w = 240, h = Math.round(w / ASPECT), c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  let best = 0;
  for (let j = 0; j < h; j++) {
    let l = -1, r = -1;
    for (let i = 0; i < w; i++) if (d[(j * w + i) * 4 + 3] > 40) { if (l < 0) l = i; r = i; }
    if (l >= 0) best = Math.max(best, r - l + 1);

  return best ? best / w : 0.3;
}
const ASPECT = 16 / 9;                          // every frame set is 1.7778
// The watch lives on its own layer: drawn after all post-processing (no tone map, grade, grain or bloom on the
// product).
const WATCH_LAYER = 3;

function makeSlot() {
  const tex = new THREE.Texture();
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const u = { map: { value: tex }, uFade: { value: 0 } };
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
    uniforms: u, transparent: true, depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D map; uniform float uFade; varying vec2 vUv;
      void main(){
        vec4 t = texture2D(map, vUv);                                      // the render as-is: no grading, no effects
        if (t.a < 0.003) discard;

  }));

function updateSlot(sl, t) {

    sl.h = WATCH.caseW / (caseFrac(s.frames[0]) * ASPECT);                  // same case width for every watch
    sl.mesh.scale.set(sl.h * ASPECT, sl.h, 1);
    sl.tIn = t;

  // after that it only turns when dragged
  const since = t - sl.tIn, k = clamp01(since / FLICK.in), eo = 1 - Math.pow(1 - k, 3);

  sl.mesh.position.set(0, REST_Y + Math.sin(since * 0.7) * 0.05 * k, WATCH.z);
  sl.mesh.rotation.z = Math.sin(since * 0.43 + 1.0) * 0.008 * k;

// Watch change: out-flick, then the next watch is revealed half-way round; the sky turns with the spin
const FLICK = { out: 0.55, in: 0.8, sky: 0.6 };   // seconds, seconds, radians of sky turn per change

// Moonlight per watch (same order as WATCHES). The key light's tuned position (LIGHT.sunPos) is turned round the moon:
// roll spins it about the view axis (which way the crescent faces), yaw swings it round the vertical (how much of the
// moon is lit); tint is a subtle colour toward the watch, k scales the key's strength. Blended on the flick's timeline.
const WATCH_LIGHT = [
  { roll: 0,   yaw: 0,   tint: '#ffffff', k: 1.0 },   // Veni
  { roll: -25, yaw: 15,  tint: '#ffe8d4', k: 1.05 },  // Vidi: warm, rose gold
  { roll: 30,  yaw: -20, tint: '#f1f3ff', k: 0.95 },  // Vici
  { roll: -50, yaw: 30,  tint: '#fff0dc', k: 1.1 },   // Écru: cream
  { roll: 55,  yaw: -35, tint: '#dce8ff', k: 1.0 },   // Lac Léman: lake blue
  { roll: 15,  yaw: 45,  tint: '#e3f4e6', k: 1.0 },   // Jura Gruén: green
];
const lightFrom = { roll: 0, yaw: 0, k: 1, tint: new THREE.Color('#ffffff') }, lightTo = { roll: 0, yaw: 0, k: 1, tint: new THREE.Color('#ffffff') };
const lightNow = { roll: 0, yaw: 0, k: 1, tint: new THREE.Color('#ffffff') };
let lightT0 = -1e9;

}
const skyTurn = { from: 0, to: 0, t0: 0 };
const skyYaw = (t) => {
  const k = clamp01((t - skyTurn.t0) / (FLICK.out + FLICK.in));
  return skyTurn.from + (skyTurn.to - skyTurn.from) * easeIO(k);

// ---------- Experience flow ----------
const $ = (id) => document.getElementById(id);
const body = document.body;
let enterT = -1, cur = -1, active = 0, lockUntil = 0, drag = null, captionTimer = 0;
for (const [, name] of WATCHES) {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', name);
  b.addEventListener('click', () => go([...$('nav').children].indexOf(b)));
  $('nav').append(b);
}

function go(i) {
  if (enterT < 0 || performance.now() < lockUntil) return;
  const dir = i > cur ? 1 : -1;                  // spin direction: forward through the list turns one way, back the other
  i = (i + WATCHES.length) % WATCHES.length;
  if (i === cur) return;
  lockUntil = performance.now() + (FLICK.out + FLICK.in) * 1000;
  const t = uTime.value, first = cur < 0;

    const old = slots[active];

  }
  // sky, moon and dust turn with every flick, the first reveal included (minus: the same way as the watch)
  Object.assign(skyTurn, { from: skyYaw(t), to: skyYaw(t) - dir * FLICK.sky, t0: t });
  // the moonlight glides from wherever it is now to this watch's preset, on the same timeline
  const now = lightAt(t), wl = WATCH_LIGHT[i % WATCH_LIGHT.length];
  Object.assign(lightFrom, { roll: now.roll, yaw: now.yaw, k: now.k }); lightFrom.tint.copy(now.tint);
  Object.assign(lightTo, { roll: wl.roll, yaw: wl.yaw, k: wl.k }); lightTo.tint.set(wl.tint);
  lightT0 = t;

  Object.assign(sl, { s: frameSet(key), startAt: t + (first ? 0 : FLICK.out * 0.8), tIn: Infinity, tOut: Infinity, frame: 0, flick: dir });
  cur = i;
  // keep frames for this watch and the next only (a 1200 set is ~240 MB decoded); going back re-reads the HTTP cache.
  // Phones keep just the current one (plus the outgoing watch until its flick ends) so the tab isn't killed for memory.
  const keep = new Set((mobile ? [0] : [0, 1]).map((d) => WATCHES[(i + d) % WATCHES.length][0]));
  for (const [k, s] of sets) if (!keep.has(k) && !slots.some((x) => x.s === s)) { s.dropped = true; sets.delete(k); }
  if (!mobile) frameSet(WATCHES[(i + 1) % WATCHES.length][0]);
  body.classList.remove('show-caption');
  [...$('nav').children].forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => {
    $('idx').textContent = `${String(i + 1).padStart(2, '0')} / ${String(WATCHES.length).padStart(2, '0')}`;
    $('title').textContent = name;
    $('discover').href = `/products/${key}`;
    body.classList.add('show-caption');
  }, (first ? 1100 : 1300));
}

$('enter').addEventListener('click', () => {

addEventListener('wheel', (e) => {

addEventListener('keydown', (e) => {

    for (const k in names) f.add(LIGHT[k], i, 0, k === 'under' ? 15 : k === 'sun' ? 10 : 3, 0.01).name(names[k]);
  }
  const p = gui.addFolder('Key light position');
  for (const a of ['x', 'y', 'z']) p.add(LIGHT.sunPos, a, -150, 150, 0.1);
  const c = gui.addFolder('Colours');
  c.addColor(LIGHT, 'sunColor').name('key').onChange((v) => sun.color.set(v));
  c.addColor(LIGHT, 'underColor').name('under').onChange((v) => under.color.set(v));
  // lights are directional, so moving the moon keeps its lighting exactly as tuned
  for (const [k, label] of [['intro', 'Moon: intro'], ['watch', 'Moon: watch view']]) {
    const mp = gui.addFolder(label);
    for (const a of ['x', 'y', 'z']) mp.add(MOON[k], a, -60, 30, 0.01);
    mp.add(MOON[k], 'size', 0.1, 20, 0.01);
  }
  gui.add(skyU.uSkyExp, 'value', 0, 40, 0.1).name('sky (HDRI) exposure');
  gui.add(skyU.uFill, 'value', 0, 4, 0.01).name('corner fill light');
  const m = gui.addFolder('Moon & bloom');
  m.add(moon.material, 'bumpScale', 0, 15, 0.1).name('relief (bump)');
  m.add(bloom, 'strength', 0, 4, 0.01).name('bloom strength');
  m.add(bloom, 'radius', 0, 1.5, 0.01).name('bloom radius');
  m.add(bloom, 'threshold', 0, 5, 0.01).name('bloom threshold');
  gui.add({ copy() {
    const out = JSON.stringify({ LIGHT, MOON, skyExposure: skyU.uSkyExp.value, cornerFill: skyU.uFill.value, bumpScale: moon.material.bumpScale,
      bloom: { strength: bloom.strength, radius: bloom.radius, threshold: bloom.threshold } }, null, 2);
    navigator.clipboard.writeText(out).then(() => alert('Lighting values copied: paste them to Claude'), () => console.log(out));
  } }, 'copy').name('📋 copy values');
}

// ---------- Loop with adaptive resolution ----------
let frames = 0, acc = 0, moonSpin = 0;
const skyEuler = new THREE.Euler(0, 0, 0, 'YXZ'), skyM4 = new THREE.Matrix4();
const pivA = new THREE.Vector3(), pivB = new THREE.Vector3(), pivQ = new THREE.Quaternion();   // moon-pivot parallax
const camBasePos = new THREE.Vector3(), camBaseQuat = new THREE.Quaternion();
const sunDir = new THREE.Vector3(), AXIS_Y = new THREE.Vector3(0, 1, 0), AXIS_Z = new THREE.Vector3(0, 0, 1);
const WATCH_PARALLAX = 0.4;                      // share of the cursor parallax the watch gets (60% less than the scene)
const watchPos = new THREE.Vector3(), watchQuat = new THREE.Quaternion(), ONE3 = new THREE.Vector3(1, 1, 1);
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  uTime.value += dt;
  const t = uTime.value;
  // camera: eased pull-back after "Enter", with a slow parallax that trails the pointer
  const e = DBG.view >= 0 ? DBG.view : enterT < 0 ? 0 : smoother(clamp01((t - enterT) / ENTER.dur));
  // the first watch flicks in once the camera has nearly landed (driven by progress, not a timer, so it never slides)
  if (enterT >= 0 && cur < 0 && e >= ENTER.reveal) go(0);
  pointerS.lerp(pointer, 0.035);
  if (DBG.spin) moonSpin += dt * 0.05;           // ~2 min per turn
  // starts with the near side (longitude 0) facing the camera; turns with the sky on a watch change. The sky's yaw
  // rotates the lookup direction, which moves the picture the opposite way, so the moon takes the negative
  moon.rotation.y = moonSpin - Math.PI / 2 - skyYaw(t);
  // dust sweeps with the same turn: the moon's face moves +x for a forward flick, so does the dust (20 units per radian)
  dust.material.uniforms.uShift.value.x = -skyYaw(t) * 20;
  const mixM = (k) => MOON.intro[k] + (MOON.watch[k] - MOON.intro[k]) * e;
  // size grows geometrically (equal ratios per step) so it reads as one steady approach, not a late balloon
  moon.position.set(mixM('x'), mixM('y'), mixM('z'));
  moon.scale.setScalar(MOON.intro.size * Math.pow(MOON.watch.size / MOON.intro.size, e));
  // parallax pivots on the moon: frame the shot without the pointer, then slide the camera with it and turn it by
  // exactly the angle that keeps the moon on the same spot. Nearer things (watch, dust) slide one way, the sky the other.
  camera.position.lerpVectors(CAM.intro.pos, CAM.exp.pos, e);
  camera.lookAt(camTgt.lerpVectors(CAM.intro.tgt, CAM.exp.tgt, e));
  pivA.subVectors(moon.position, camera.position).normalize();
  camBasePos.copy(camera.position); camBaseQuat.copy(camera.quaternion);   // the pose without pointer parallax
  camera.position.x += pointerS.x * 0.6; camera.position.y -= pointerS.y * 0.25;
  pivB.subVectors(moon.position, camera.position).normalize();
  camera.quaternion.premultiply(pivQ.setFromUnitVectors(pivA, pivB));
  // intro: crescent lit from below; watch view: key light from the upper left, night side falls to black
  const mixL = (k) => LIGHT[k][0] + (LIGHT[k][1] - LIGHT[k][0]) * e;
  under.intensity = mixL('under'); sun.intensity = mixL('sun'); moonRim.k.value = mixL('limb');
  hemi.intensity = mixL('hemi'); fill.intensity = mixL('fill'); rim.intensity = mixL('rim');
  moon.material.emissiveIntensity = mixL('earthshine');
  // per-watch moonlight: the tuned key position turned round the moon (yaw about the vertical, roll about the view
  // axis), tinted toward the watch and scaled; lightAt() blends presets on the flick's timeline
  const wl = lightAt(t);
  sunDir.set(LIGHT.sunPos.x, LIGHT.sunPos.y, LIGHT.sunPos.z).sub(sun.target.position)
    .applyAxisAngle(AXIS_Y, THREE.MathUtils.degToRad(wl.yaw)).applyAxisAngle(AXIS_Z, THREE.MathUtils.degToRad(wl.roll));
  sun.position.copy(sun.target.position).add(sunDir);
  sun.intensity *= wl.k;
  sun.color.set(LIGHT.sunColor).multiply(wl.tint);
  moonRim.dir.value.subVectors(sun.position, sun.target.position).normalize().transformDirection(camera.matrixWorldInverse);
  // sky drifts gently with the pointer (and very slowly on its own)
  // no pointer term here any more: the camera's turn round the moon now moves the sky, in the right direction
  skyEuler.set(0, t * 0.002 + skyYaw(t), 0);   // slow drift + the turn that follows a watch change
  skyU.uSkyRot.value.setFromMatrix4(skyM4.makeRotationFromEuler(skyEuler));
  // moon glow in the sky: direction and angular radius of the moon's disc from the camera
  const md = skyU.uMoonDir.value.subVectors(moon.position, camera.position), mDist = md.length();
  md.divideScalar(mDist);
  skyU.uMoonRad.value = Math.asin(Math.min(1, moonR * moon.scale.x / mDist));
  meteorUpdate(t);
  for (const sl of slots) updateSlot(sl, t);
  composer.render(dt);
  // the product on top of everything, untouched by post; rendered even when hidden so it clears
  // the watch sees only 40% of the pointer parallax: its camera sits 40% of the way from the no-pointer pose to the real one
  watchPos.lerpVectors(camBasePos, camera.position, WATCH_PARALLAX);
  watchQuat.slerpQuaternions(camBaseQuat, camera.quaternion, WATCH_PARALLAX);
  watchCam.matrixWorld.compose(watchPos, watchQuat, ONE3); watchCam.matrixWorldInverse.copy(watchCam.matrixWorld).invert();
  watchCam.projectionMatrix.copy(camera.projectionMatrix); watchCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  watchR.render(scene, watchCam);
  // every ~90 frames: lower resolution if under ~45 fps (floor 0.75), restore it with headroom
  acc += dt; if (++frames === 90) {
    const avg = acc / frames; frames = 0; acc = 0;
    const cap = Math.min(devicePixelRatio, Q.maxPR);
    if (avg > 1 / 45 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.15); resize(); sizeWatchR(); }
    else if (avg < 1 / 58 && pixelRatio < cap) { pixelRatio = Math.min(cap, pixelRatio + 0.1); resize(); sizeWatchR(); }
  }
});
</script>
